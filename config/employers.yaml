# Registre des employeurs cibles (cartographie du 14/10/2026 + vérification du 21/10/2026).
#
# Règles : aucune URL n'est inventée. `career_url` n'est renseignée que si elle a répondu en HTTP 200 lors de la
# vérification ; sinon `career_url: null` et la raison figure dans `verification_note`.
# `source_key` relie l'employeur à un connecteur de config/sources.yaml (quand la page publie des offres collectables).
# Ajouter un employeur = ajouter une entrée ; si sa page est collectable, créer un connecteur dédié.

employers:
