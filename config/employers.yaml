    name: Sonatel
    sector: Télécommunications
    country: SN
    website: https://sonatel.sn/
    career_url: https://sonatel.sn/capital-humain/travailler-a-sonatel/
    collection_method: none
    source_key: null
    status: to_verify
    checked_on: 2026-10-21
    verification_note: "Site officiel et page « Nous rejoindre » accessibles (HTTP 200). Aucune liste d'offres publique repérée : la page renvoie vers un formulaire de candidature spontanée/stage (https://sonatel.sn/demande-demplois-candidature-spontanee-stage/). « Mon job à Sonatel » est une rubrique de témoignages. Veille via LinkedIn / ajout manuel."

