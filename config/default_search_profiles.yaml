# Profils de recherche créés au premier démarrage (si la table est vide). Ensuite, tout se modifie dans l'interface.
#
# - `positive_keywords` : termes recherchés ET utilisés pour le score « métier ». L'ordre = priorité de requête
#   (les sources plafonnent le nombre de requêtes). Aucune annonce n'a besoin de correspondre à TOUS les mots-clés.
# - `keyword_groups`    : compétences techniques regroupées (score « compétences »). Valeurs par défaut = HYPOTHÈSES
#   à ajuster selon votre profil réel ; elles n'affirment rien sur vos compétences.
# - `excluded_keywords` : un mot exclu dans le titre met le score à 0 ; dans la description, il retire 20 points.
# - `weights`           : surcharge des pondérations (sinon 30/25/15/10/10/10) ; une clé à 0 désactive le critère.
# - `cities[0]` = ville prioritaire. Codes pays ISO 3166-1 alpha-2.
# - Valeurs de contract_types : cdi, cdd, stage, freelance, alternance, interim, full_time, part_time, contract.
# - Valeurs de work_modes : onsite, hybrid, remote. experience_levels : intern, junior, mid, senior, lead.

default_weights:
  role: 30
  skills: 25
  location: 15
  experience: 10
  sector: 10
  contract_work_mode: 10

