# Registre des sources JobRadar.
#
# - `implementation: implemented` : un connecteur existe dans backend/jobradar/collectors (clé = `connector`).
# - `implementation: deferred`    : source à revérifier / non intégrée (raison ci-dessous).
# - `implementation: excluded`    : source écartée (conditions d'utilisation ou accès automatisé interdit).
# - `enabled` n'est lu qu'à la création : l'utilisateur active/désactive ensuite dans l'interface (stocké en base).
# - `doc_status` = statut de la cartographie du 14/10/2026 (observation historique, conservée telle quelle).
# - `checked_on` / `decision_reason` = vérification réelle faite lors de l'intégration (voir docs/source-feasibility.md).
# - `configuration` est public : jamais de secret ici.
#
# Ajouter une source : créer un connecteur, l'enregistrer dans collectors/registry.py, ajouter une entrée ici.

sources:
  # ------------------------------------------------------------------ Sénégal : sites d'emploi
  - key: emploi_dakar
    connector: emploi_dakar
    name: Emploi Dakar
    base_url: https://www.emploidakar.com/
    type: job_board
    market: local
    countries: [SN]
    collection_method: json_endpoint_html   # endpoint public jm-ajax/get_listings + JSON-LD de l'annonce
    implementation: implemented
    enabled: true
    verification_status: verified
    doc_status: "✅ vérifié (offres du 9, 12 et 13 oct. 2026)"
    checked_on: 2026-10-21
    decision_reason: "Recherche par mots-clés fonctionnelle, dates de publication/limite réelles, URL directe de chaque annonce."
    tos_note: "CGU : usage personnel et privé ; interdit d'extraire les bases de données et les liens profonds. robots.txt autorise le chemin. À réserver à un usage personnel ; demander l'accord écrit de Carriere360 pour tout autre usage."
    configuration: {min_delay_seconds: 3.0, per_page: 20, max_queries: 6, detail_budget: 15}

  - key: emploisenegal
    connector: emploisenegal
    name: Emploi Sénégal
    base_url: https://www.emploisenegal.com/
    type: job_board
    market: local
    countries: [SN]
    collection_method: html_list         # cartes de liste (catégorie Informatique + pages générales filtrées localement)
    implementation: implemented
    enabled: true
    verification_status: verified
    doc_status: "🟡 existe, activité probable (accès direct refusé pendant la recherche du 14/10)"
    checked_on: 2026-10-21
    decision_reason: "Accessible le 21/10/2026 (HTTP 200, ~2 477 postes affichés). Le paramètre de recherche GET est ignoré par le site : lecture de la catégorie Informatique + filtrage local."
    tos_note: "robots.txt : Allow /, Content-Signal search=yes ai-train=no. Pas de clause d'interdiction repérée dans la page consultée."
    configuration: {min_delay_seconds: 2.0, host: www.emploisenegal.com, search_path: /recherche-jobs-senegal, offer_prefix: /offre-emploi-senegal/, country: SN, it_category_id: 31, category_pages: 1, general_pages: 2}

