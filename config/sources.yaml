    enabled: true
    verification_status: verified
    doc_status: "✅ vérifié (8 539+ offres, page pays /senegal/fr/emplois)"
    checked_on: 2026-10-21
    decision_reason: "Recherche ?q= fonctionnelle, URL directe, date de publication exacte dans le JSON-LD de l'annonce."
    tos_note: "robots.txt : pages publiques autorisées aux robots génériques (ai-train=no). CGU : reproduction non autorisée du contenu du site (clause de propriété intellectuelle) ; usage ici = veille personnelle avec lien vers l'original."
    configuration: {min_delay_seconds: 2.0, country_slug: senegal, max_queries: 6, detail_budget: 15}

