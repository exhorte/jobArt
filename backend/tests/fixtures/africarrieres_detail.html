<!doctype html><html><head><meta charset="utf-8"><script type="application/ld+json">{"@context":"https:\/\/schema.org","@type":"JobPosting","title":"AML Transaction Monitoring Analyst","description":"\u003Cdiv class=\u0022content-intro\u0022\u003E\u003Ch2\u003EOur mission\u003C\/h2\u003E\n\n\u003Cp\u003EWe\u0027re making Africa the first cashless continent.\u003C\/p\u003E\n\n\u003Cp\u003EIn 2017, over half the population in Sub-Saharan Africa had no bank account. That\u0027s for good reason—the fees are too high, the closest branch can be miles away, and nobody takes cards. Without access to financial institutions, people are forced to keep their savings under the mattress. Small business owners rely on lenders who charge extortionate rates. Parents spend hours waiting in line to pay school fees in cash.\u003C\/p\u003E\n\n\u003Cp\u003EWe\u0027re solving this by building financial services that just work: no account fees, instantly available, and accepted everywhere. In places where electricity, water and roads don\u0027t always work, you can still send money with Wave. In 2017, we launched a mobile app in Senegal for cash deposit, withdrawal, and peer-to-peer and business payments. Now, we have millions of users across 9 countries and are growing fast.\u003C\/p\u003E\n\n\u003Cp\u003EOur goal is to make Africa the first cashless continent and that\u0027s where you come in...\u003C\/p\u003E\u003C\/div\u003E\n\n\u003Ch2\u003E\u003Cstrong\u003EHow you\u0027ll help us achieve it\u003C\/strong\u003E\u003C\/h2\u003E\n\n\u003Cp\u003E\u003Cspan\u003EWe are looking for an AML Investigator familiar with money laundering trends and comfortable investigating complex cases to support our Financial Security Team’s mission to prevent, detect, and report suspicious activity. The position will report to our Senegal Compliance Analyst.\u003C\/span\u003E\u003C\/p\u003E\n\n\u003Cp\u003E\u003Cspan\u003EIn this role, you will;\u003C\/span\u003E\u003C\/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cspan\u003EConduct investigations on alerts generated by our AML Transaction Monitoring system.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EParticipate in enhancing alerts to reduce overall false positives and prioritize the investigation of suspicious activity.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003ESupport the Financial Security Manager in reviewing reports generated by other Analysts.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EContribute to the effectiveness of the Transaction Monitoring System by identifying weaknesses and proposing improvement measures.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EContribute to the generation of Financial Security reports.\u0026nbsp;\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EParticipate in awareness-raising and training activities relating to financial security.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003ECarry out investigations into suspicious transactions and activities.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EPrepare suspicious transaction reports.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EContribute to drafting reports and dashboard updates for Decision Makers.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EAssist the Financial Security Manager in ensuring the implementation of embargo restrictions issued by the regulator, with the approval of Wave\u0027s governing body.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EGather information about requisitions from law enforcement authorities and\/or the financial intelligence authority.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EOther duties may be assigned as required.\u003C\/span\u003E\u003C\/li\u003E\n\u003C\/ul\u003E\n\n\u003Ch2\u003E\u003Cstrong\u003EKey details\u003C\/strong\u003E\u003C\/h2\u003E\n\n\u003Cul\u003E\n\u003Cli\u003ELocation: You\u0027ll work from our office in Dakar.\u003C\/li\u003E\n\u003Cli\u003EYou must have work authorization in Senegal.\u003C\/li\u003E\n\u003Cli\u003EThis is a permanent contract.\u003C\/li\u003E\n\u003Cli\u003EOur salaries are competitive and calculated using a transparent formula.\u0026nbsp;\u003C\/li\u003E\n\u003Cli\u003EWe offer generous health insurance for yourself and your dependents.\u003C\/li\u003E\n\u003Cli\u003EWe support working parents - we offer (26 weeks for mothers and 4 weeks for fathers) and subsidized child care when you return to work.\u003C\/li\u003E\n\u003Cli\u003EWe help you live your fullest life now- we subsidize gym memberships and fitness classes.\u003C\/li\u003E\n\u003Cli\u003EAirtime reimbursement.\u003C\/li\u003E\n\u003Cli\u003EFree food and a beautiful office space.\u003C\/li\u003E\n\u003C\/ul\u003E\n\n\u003Ch2\u003E\u003Cstrong\u003ERequirements\u003C\/strong\u003E\u003C\/h2\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E\u003Cspan\u003EProficiency in spoken and written French and English. Fluency in Wolof \u003C\/span\u003E\u003Cspan\u003Eand another local language \u003C\/span\u003E\u003Cspan\u003Ewould be an advantage.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EBachelor’s degree or above in IT, finance, criminology, Risk Management, or other relevant disciplines.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EAt least 3 years of relevant experience in AML Transaction Monitoring and\/or Sanctions Screening at a financial institution.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003ECompliance certifications, such as ACAMS, are a plus.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EProficient knowledge of AML\/CFT risks.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EGood knowledge of UEMOA financial security regulations.\u003C\/span\u003E\u003C\/li\u003E\n\u003C\/ul\u003E\n\n\u003Ch2\u003E\u003Cstrong\u003EYou might be a good fit if you have\u003C\/strong\u003E\u003C\/h2\u003E\n\n\u003Cul\u003E\n\u003Cli\u003E\u003Cspan\u003EStrong computer skills.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EStrong analytical skills.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EGood communication skills, both verbal and written.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003ESelf-motivated and able to work under pressure.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EGood attention to detail and seek excellence in everything you do.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EIntellectual curiosity and creativity in the way you go about tackling problems.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EA positive attitude and embracing failure as a means to spark innovation and growth.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EA willingness to go the distance to get something done.\u003C\/span\u003E\u003C\/li\u003E\n\u003Cli\u003E\u003Cspan\u003EExperience working in a fast-paced environment and can adapt quickly to changing priorities.\u003C\/span\u003E\u003C\/li\u003E\n\u003C\/ul\u003E\n\u003Cdiv class=\u0022content-conclusion\u0022\u003E\u003Ch2\u003EOur team\u003C\/h2\u003E\n\n\u003Cul\u003E\n\u003Cli data-stringify-indent=\u00220\u0022 data-stringify-border=\u00220\u0022\u003EWe have a rapidly growing in-country team in Senegal, Côte d\u0027Ivoire, Mali, Burkina Faso, The Gambia, Uganda, Niger, Sierra Leone, and Cameroon plus remote team members spread across the world.\u003C\/li\u003E\n\u003Cli data-stringify-indent=\u00220\u0022 data-stringify-border=\u00220\u0022\u003EWe\u0027re deeply passionate about our mission of bringing radically affordable financial services to the people who need them most.\u003C\/li\u003E\n\u003Cli data-stringify-indent=\u00220\u0022 data-stringify-border=\u00220\u0022\u003EWe foster autonomy for our employees. You\u0027ll own your projects at every stage, from understanding the problem to monitoring your solution in production.\u003C\/li\u003E\n\u003Cli data-stringify-indent=\u00220\u0022 data-stringify-border=\u00220\u0022\u003EWe raised the largest Series A in Africa in 2021. Our world-class investors, include Founders Fund, Sequoia Heritage, Stripe, Ribbit Capital, Y Combinator, and Partech Africa.\u003C\/li\u003E\n\u003Cli data-stringify-indent=\u00220\u0022 data-stringify-border=\u00220\u0022\u003EWe are on\u0026nbsp;Y Combinator\u0027s top companies by revenue.\u003C\/li\u003E\n\u003C\/ul\u003E\n\n\u003Ch2\u003EHow to apply\u003C\/h2\u003E\n\n\u003Cp\u003EFill out the form below, and upload a resume in English and a\u0026nbsp;cover letter describing your interest in Wave and the role.\u003C\/p\u003E\n\n\u003Cp\u003EWe review applications frequently and recommend that you apply to the role that most closely aligns with your skills, experience and career goals.\u003C\/p\u003E\n\n\u003Cp\u003EWave is an equal-opportunity employer. We celebrate diversity and are committed to creating an inclusive environment for all employees.\u003C\/p\u003E\u003C\/div\u003E","datePosted":"2026-10-21T10:38:05+00:00","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Dakar","addressCountry":"SN"}},"hiringOrganization":{"@type":"Organization","name":"Wave","sameAs":null},"validThrough":"2026-12-20T12:27:13+00:00","employmentType":"FULL_TIME"}</script></head><body><p>fixture</p></body></html>
