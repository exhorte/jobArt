[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobart"
version = "0.1.0"
description = "jobArt - agrégateur personnel d'offres d'emploi (mono-utilisateur, local)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<7.0",
    "apscheduler>=3.10,<4.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["jobart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests d'intégration qui accèdent à Internet (exclus par défaut, lancer avec -m network)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # jeux de données de test : lisibilité plutôt que longueur de ligne
"jobart/services/enrich.py" = ["E501"]  # tables de mots-clés (une entrée par ligne)
